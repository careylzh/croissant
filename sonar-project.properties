 # SonarQube configuration for Croissant project
sonar.projectKey=croissant
sonar.projectName=Croissant
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/output.css,**/*.min.js,**/coverage/**,**/.git/**,**/prisma/migrations/**

# JavaScript/Node.js specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.coveragePlugin=lcov

# Security and quality settings
sonar.security.sources.javasecurity=true
sonar.security.sources.pythonsecurity=true
sonar.security.sources.phpsecurity=true
sonar.security.sources.javascriptsecurity=true

# Analysis settings
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Authentication (default admin credentials)
sonar.login=admin
sonar.password=admin